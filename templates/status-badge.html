<div class="tooltip-wrap" style="display:inline-block;">
  <!-- v-if / v-else-if / v-else: Status Kosong -->
  <span v-if="qty === 0" class="badge badge-kosong">
    <i data-lucide="slash" style="width:12px;height:12px;margin-right:4px;"></i> {{ statusInfo.label }}
  </span>
  <!-- Status Menipis -->
  <span v-else-if="qty < safety" class="badge badge-menipis">
    <i data-lucide="alert-triangle" style="width:12px;height:12px;margin-right:4px;"></i> {{ statusInfo.label }}
  </span>
  <!-- Status Aman -->
  <span v-else class="badge badge-aman">
    <i data-lucide="check-circle-2" style="width:12px;height:12px;margin-right:4px;"></i> {{ statusInfo.label }}
  </span>

  <!-- Tooltip catatanHTML — v-html directive -->
  <div class="tooltip-content" v-if="catatanHTML">
    <div style="font-size:0.7rem;color:var(--text-muted);margin-bottom:4px;display:flex;align-items:center;gap:4px;"><i data-lucide="file-text" style="width:12px;height:12px;"></i> Catatan</div>
    <div v-html="catatanHTML"></div>
  </div>
</div>
